<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT Teacher Planner</title>
 
<style>
 
body{
font-family: Arial, sans-serif;
margin:0;
background:#f4f6f8;
}
 
header{
background:#003366;
color:white;
text-align:center;
padding:20px;
}
 
.card{
background:white;
margin:12px;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.12);
}
 
h2{
margin-top:0;
}
 
label{
display:block;
margin-top:10px;
margin-bottom:5px;
font-weight:bold;
}
 
input,
textarea,
select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}
 
textarea{
min-height:90px;
resize:vertical;
}
 
button{
width:100%;
background:#0078d4;
color:white;
border:none;
padding:14px;
border-radius:8px;
font-size:16px;
margin-top:15px;
cursor:pointer;
}
 
button:hover{
background:#005ea6;
}
 
.saved{
color:green;
text-align:center;
margin-top:10px;
font-weight:bold;
}
 
</style>
</head>
 
<body>
 
<header>
<h1>DT Teacher Planner</h1>
</header>
 
<div class="card">
 
<h2>Select Class</h2>
 
<select id="classSelect"></select>
 
</div>
 
<div class="card">
 
<label>Current Topic</label>
<input id="topic" placeholder="e.g. CAD and CAM">
 
<label>Current Lesson</label>
<input id="lesson" placeholder="e.g. Lesson 4">
 
<label>Homework</label>
<textarea id="homework" placeholder="Homework details"></textarea>
 
<label>Assessment Notes</label>
<textarea id="assessment" placeholder="Assessment information"></textarea>
 
<label>Progress</label>
<select id="progress">
<option>On Track</option>
<option>Ahead</option>
<option>Behind</option>
<option>Needs Intervention</option>
</select>
 
<label>General Notes</label>
<textarea id="notes" placeholder="Class notes"></textarea>
 
<label>Next Actions</label>
<textarea id="actions" placeholder="Things to do before next lesson"></textarea>
 
<button onclick="saveClass()">Save Class Information</button>
 
<div class="saved" id="savedMessage"></div>
 
</div>
 
<script>
 
const classes = [
 
"7X DT4",
"7X DT5",
"7X DT2",
"7W DT4",
"7W DT2",
 
"8W DT2",
"8W DT4",
"8W DT5",
"8X DT2",
"8X DT4",
 
"9W DT2",
"9W DT4",
"9X DT2",
"9X DT4",
"9X DT5",
 
"10B CN1",
"10D CN1"
 
];
 
const classSelect =
document.getElementById("classSelect");
 
classes.forEach(className => {
 
let option =
document.createElement("option");
 
option.value = className;
option.textContent = className;
 
classSelect.appendChild(option);
 
});
 
function saveClass(){
 
const className = classSelect.value;
 
const data = {
 
topic:
document.getElementById("topic").value,
 
lesson:
document.getElementById("lesson").value,
 
homework:
document.getElementById("homework").value,
 
assessment:
document.getElementById("assessment").value,
 
progress:
document.getElementById("progress").value,
 
notes:
document.getElementById("notes").value,
 
actions:
document.getElementById("actions").value
 
};
 
localStorage.setItem(
className,
JSON.stringify(data)
);
 
document.getElementById("savedMessage").innerText =
"✓ Saved";
 
setTimeout(() => {
 
document.getElementById("savedMessage").innerText = "";
 
}, 2000);
 
}
 
function loadClass(){
 
const className = classSelect.value;
 
const data =
JSON.parse(
localStorage.getItem(className)
) || {};
 
document.getElementById("topic").value =
data.topic || "";
 
document.getElementById("lesson").value =
data.lesson || "";
 
document.getElementById("homework").value =
data.homework || "";
 
document.getElementById("assessment").value =
data.assessment || "";
 
document.getElementById("progress").value =
data.progress || "On Track";
 
document.getElementById("notes").value =
data.notes || "";
 
document.getElementById("actions").value =
data.actions || "";
 
}
 
classSelect.addEventListener(
"change",
loadClass
);
 
loadClass();
 
</script>
 
</body>
</html>
