<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌸 DT Teacher Planner</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#fff0f5;
    padding-bottom:80px;
}

header{
    background:#d63384;
    color:white;
    text-align:center;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.screen{
    display:none;
    padding:12px;
}

.active{
    display:block;
}

.card{
    background:#fff8fb;
    padding:15px;
    margin-bottom:12px;
    border-radius:15px;
    border-left:6px solid #d63384;
    box-shadow:0 3px 6px rgba(214,51,132,.15);
}

h1{
    margin:0;
}

h2{
    margin-top:0;
    color:#d63384;
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    border:2px solid #f7b2d0;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#d63384;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:bold;
    margin-bottom:10px;
}

button:hover{
    background:#c2185b;
}

.lesson{
    background:#ffe4ef;
    padding:10px;
    border-radius:10px;
    margin-bottom:6px;
}

.bottomnav{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    background:white;
    border-top:3px solid #f7b2d0;
}

.bottomnav button{
    flex:1;
    background:white;
    color:#d63384;
    margin:0;
    border-radius:0;
}

.badge{
    background:#d63384;
    color:white;
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
}

</style>
</head>
<body>

<header>
<h1>🌸 DT Teacher Planner</h1>
</header>

<!-- HOME -->
 
<div id="home" class="screen active">
 
<div class="card">
 
<h2>🌸 Today</h2>
 
<label>Current Week</label>
 
<select id="currentWeek">
<option>A</option>
<option>B</option>
</select>
 
<label>Current Day</label>
 
<select id="currentDay">
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
</select>
 
<div id="todayLessons"></div>
 
</div>
 
<div class="card">
 
<h2>✅ Outstanding Tasks</h2>
 
<div id="outstandingTasks"></div>
 
</div>
 
</div>
S

<!-- TIMETABLE -->

<div id="timetable" class="screen">

<div class="card">

<h2>📅 Timetable Editor</h2>

<label>Week</label>
<select id="week">
<option>A</option>
<option>B</option>
</select>

<label>Day</label>
<select id="day">
<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
</select>

<input id="p1" placeholder="Period 1">
<input id="p2" placeholder="Period 2">
<input id="p3" placeholder="Period 3">
<input id="p4" placeholder="Period 4">
<input id="p5" placeholder="Period 5">

<button onclick="saveTimetable()">
Save Timetable
</button>

<button onclick="loadTimetableEditor()">
Load Timetable
</button>

</div>

</div>

<!-- CLASSES -->

<div id="classes" class="screen">

<div class="card">

<h2>📚 Class Tracker</h2>

<input id="searchBox" placeholder="Search class">

<select id="classSelect"></select>

<label>Current Topic</label>
<input id="topic">

<label>Current Lesson</label>
<input id="lesson">

<button onclick="lessonTaught()">
✅ Lesson Taught
</button>

<label>Progress</label>
<select id="progress">
<option>On Track</option>
<option>Ahead</option>
<option>Behind</option>
<option>Needs Intervention</option>
</select>

<label>Homework</label>
<textarea id="homework"></textarea>

<label>Assessment Notes</label>
<textarea id="assessment"></textarea>

<label>Class Notes</label>
<textarea id="notes"></textarea>

<label>Next Actions</label>
<textarea id="actions"></textarea>

<button onclick="saveClass()">
Save Class
</button>

</div>

</div>

<!-- TASKS -->

<div id="tasks" class="screen">

<div class="card">

<h2>✅ Tasks</h2>

<input id="taskInput" placeholder="Add task">

<button onclick="addTask()">
Add Task
</button>

<ul id="taskList"></ul>

</div>

</div>

<!-- NAVIGATION -->

<div class="bottomnav">

<button onclick="showScreen('home')">
🏠
</button>

<button onclick="showScreen('timetable')">
📅
</button>

<button onclick="showScreen('classes')">
📚
</button>

<button onclick="showScreen('tasks')">
✅
</button>

</div>

<script>

const classes = [

"7X DT4",
"7X DT5",
"7X DT2",
"7W DT4",
"7W DT2",
"8W DT2",
"8W DT4",
"8W DT5",
"8X DT2",
"8X DT4",
"9W DT2",
"9W DT4",
"9X DT2",
"9X DT4",
"9X DT5",
"10B CN1",
"10D CN1"

];

const classSelect =
document.getElementById("classSelect");

function populateClasses(){

classSelect.innerHTML="";

classes.forEach(cls=>{

const option=
document.createElement("option");

option.value=cls;
option.textContent=cls;

classSelect.appendChild(option);

});

}

populateClasses();

function showScreen(screen){

document
.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"));

document
.getElementById(screen)
.classList.add("active");

}

function saveClass(){

const data={

topic:topic.value,
lesson:lesson.value,
progress:progress.value,
homework:homework.value,
assessment:assessment.value,
notes:notes.value,
actions:actions.value

};

localStorage.setItem(
classSelect.value,
JSON.stringify(data)
);

alert("Saved");

}

function loadClass(){

const data=
JSON.parse(
localStorage.getItem(classSelect.value)
) || {};

topic.value=data.topic || "";
lesson.value=data.lesson || "";
progress.value=data.progress || "On Track";
homework.value=data.homework || "";
assessment.value=data.assessment || "";
notes.value=data.notes || "";
actions.value=data.actions || "";

}

classSelect.addEventListener(
"change",
loadClass
);

loadClass();

function lessonTaught(){

let current =
parseInt(lesson.value) || 0;

lesson.value = current + 1;

saveClass();

}

function addTask(){

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

if(taskInput.value==="") return;

tasks.push({
text:taskInput.value,
done:false
});

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

taskInput.value="";

renderTasks();

}

function renderTasks(){

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

taskList.innerHTML="";

tasks.forEach((task,index)=>{

let li =
document.createElement("li");

li.innerHTML = `

<input
type="checkbox"
${task.done ? "checked" : ""}
onchange="toggleTask(${index})">

${task.text}

`;

taskList.appendChild(li);

});

}

function toggleTask(index){

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

tasks[index].done =
!tasks[index].done;

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

renderTasks();

}

renderTasks();

function saveTimetable(){

const data={

p1:p1.value,
p2:p2.value,
p3:p3.value,
p4:p4.value,
p5:p5.value

};

localStorage.setItem(
week.value + "-" + day.value,
JSON.stringify(data)
);

alert("Timetable saved");

}

function loadTimetableEditor(){

const data =
JSON.parse(
localStorage.getItem(
week.value + "-" + day.value
)
) || {};

p1.value=data.p1 || "";
p2.value=data.p2 || "";
p3.value=data.p3 || "";
p4.value=data.p4 || "";
p5.value=data.p5 || "";

}

function showToday(){
 
const key =
currentWeek.value + "-" + currentDay.value;
 
const data =
JSON.parse(
localStorage.getItem(key)
);
 
console.log("KEY:", key);
console.log("DATA:", data);
 
if(!data){
 
todayLessons.innerHTML =
"<div class='lesson'>No timetable found for " +
key +
"</div>";
 
return;
 
}
 
todayLessons.innerHTML =
"<div class='lesson'>P1 - " + (data.p1 || "Free") + "</div>" +
"<div class='lesson'>P2 - " + (data.p2 || "Free") + "</div>" +
"<div class='lesson'>P3 - " + (data.p3 || "Free") + "</div>" +
"<div class='lesson'>P4 - " + (data.p4 || "Free") + "</div>" +
"<div class='lesson'>P5 - " + (data.p5 || "Free") + "</div>";
 
}

 function openClass(className){
 
if(!classes.includes(className)){
return;
}
 
showScreen("classes");
 
classSelect.value = className;
 
loadClass();
 
}   
    
document
.getElementById("searchBox")
.addEventListener("input", function(){

const search =
this.value.toLowerCase();

classSelect.innerHTML="";

classes
.filter(c =>
c.toLowerCase().includes(search))
.forEach(c=>{

const option =
document.createElement("option");

option.value=c;
option.textContent=c;

classSelect.appendChild(option);

});

if(classSelect.options.length > 0){
loadClass();
}

});

    showToday();

</script>

</body>
</html>
