<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT Teacher Planner</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f8;
margin:0;
}

header{
background:#003366;
color:white;
padding:15px;
text-align:center;
}

.card{
background:white;
margin:12px;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

h2{
margin-top:0;
}

input,textarea,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#0078d4;
color:white;
border:none;
padding:12px;
border-radius:8px;
width:100%;
}

.task{
display:flex;
margin-bottom:8px;
}

.task input{
flex:1;
margin-right:8px;
}

.small{
font-size:14px;
color:#666;
}

</style>
</head>
<body>

<header>
<h1>DT Teacher Planner</h1>
</header>

<div class="card">

<h2>Dashboard</h2>

<p id="classCount"></p>

<p class="small">
Keep track of all DT and Construction classes.
</p>

</div>

<div class="card">

<h2>Tasks</h2>

<div class="task">
<input id="taskInput" placeholder="Add a task">
<button onclick="addTask()">Add</button>
</div>

<ul id="taskList"></ul>

</div>

<div class="card">

<h2>Select Class</h2>

<select id="classSelect"></select>

<label>Current Topic</label>
<input id="topic">

<label>Current Lesson</label>
<input id="lesson">

<label>Homework</label>
<textarea id="homework"></textarea>

<label>Assessment Notes</label>
<textarea id="assessment"></textarea>

<label>Progress</label>
<select id="progress">
<option>On Track</option>
<option>Ahead</option>
<option>Behind</option>
<option>Needs Intervention</option>
</select>

<label>General Notes</label>
<textarea id="notes"></textarea>

<label>Next Actions</label>
<textarea id="actions"></textarea>

<button onclick="saveClass()">
Save Class
</button>

<p id="saveMessage"></p>

</div>

<script>

const classes = [

"7X DT4",
"7X DT5",
"7X DT2",
"7W DT4",
"7W DT2",

"8W DT2",
"8W DT4",
"8W DT5",
"8X DT2",
"8X DT4",

"9W DT2",
"9W DT4",
"9X DT2",
"9X DT4",
"9X DT5",

"10B CN1",
"10D CN1"

];

const select =
document.getElementById("classSelect");

classes.forEach(c=>{

let option =
document.createElement("option");

option.textContent=c;
option.value=c;

select.appendChild(option);

});

document.getElementById("classCount")
.innerHTML =
"<strong>" + classes.length +
"</strong> classes loaded";

function saveClass(){

const data={

topic:topic.value,
lesson:lesson.value,
homework:homework.value,
assessment:assessment.value,
progress:progress.value,
notes:notes.value,
actions:actions.value

};

localStorage.setItem(
select.value,
JSON.stringify(data)
);

saveMessage.innerHTML =
"✅ Saved";

}

function loadClass(){

const data =
JSON.parse(
localStorage.getItem(select.value)
) || {};

topic.value=data.topic||"";
lesson.value=data.lesson||"";
homework.value=data.homework||"";
assessment.value=data.assessment||"";
progress.value=data.progress||"On Track";
notes.value=data.notes||"";
actions.value=data.actions||"";

}

select.addEventListener(
"change",
loadClass
);

loadClass();

function addTask(){

const text =
document.getElementById("taskInput").value;

if(!text) return;

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

tasks.push(text);

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

document.getElementById("taskInput").value="";

renderTasks();

}

function renderTasks(){

let tasks =
JSON.parse(
localStorage.getItem("tasks")
) || [];

const list =
document.getElementById("taskList");

list.innerHTML="";

tasks.forEach(task=>{

let li =
document.createElement("li");

li.textContent =
task;

list.appendChild(li);

});

}

renderTasks();

</script>

</body>
</html>
